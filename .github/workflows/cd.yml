name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  deploy:
    name: Deploy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Build server
        working-directory: server
        run: |
          npm ci
          npm run db:generate
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veranda-build-${{ github.run_id }}
          path: |
            client/.next
            server/dist

      - name: Trigger deployment webhook (optional)
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            curl -X POST "$DEPLOY_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{"sha":"${{ github.event.workflow_run.head_sha }}","repository":"${{ github.repository }}"}'
          else
            echo "No DEPLOY_WEBHOOK_URL configured. Artifacts uploaded; deployment step skipped."
          fi
